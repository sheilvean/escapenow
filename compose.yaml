services:
  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: escapenow
      POSTGRES_PASSWORD: escapenow
      POSTGRES_DB: escapenow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escapenow -d escapenow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # PostgreSQL 18+ stores data under a major-version subdirectory of
      # /var/lib/postgresql. Mounting the old /var/lib/postgresql/data path makes
      # the official image refuse to start.
      - escapenow-postgres:/var/lib/postgresql

volumes:
  escapenow-postgres:
